spring.application.name=aion-api
server.port=${SERVER_PORT:8081}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/aion}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aion_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me-local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
