services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: aion
      MYSQL_USER: aion_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-local}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change-root-local}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [aion-net]

  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/aion?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: aion_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-change-me-local}
      SERVER_PORT: 8081
    depends_on:
      db:
        condition: service_healthy
    networks: [aion-net]

  ai-service:
    build: ./ai-service
    environment:
      AI_PORT: 8000
      AUTOMATION_ALLOWED_HOSTS: example.com,localhost
      VISER_URL: http://viser:8082
    ports:
      - "8000:8000"
    depends_on: [viser]
    networks: [aion-net]

  viser:
    build: ./ai-service
    command: ["python", "-m", "app.viser_scene"]
    environment:
      VISER_HOST: 0.0.0.0
      VISER_PORT: 8082
    ports:
      - "8082:8082"
    networks: [aion-net]

  frontend:
    build: ./frontend
    networks: [aion-net]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [frontend, api, ai-service]
    networks: [aion-net]

volumes:
  mysql_data:

networks:
  aion-net:
    driver: bridge
